<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#07060a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="FALSE PROPHET: BREAKDOWN — reunite the band on an alien island before the 18-minute harvest completes." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>FALSE PROPHET: BREAKDOWN</title>
  </head>
  <body>
    <div id="app">
      <aside id="side-left" class="side" aria-hidden="true">
        <div class="side-stack">
          <span>LOUDER</span><span>FURTHER</span><span>STRANGER</span><span>TOGETHER</span>
        </div>
      </aside>
      <div id="frame">
        <div id="game"></div>
        <div id="ui" aria-live="polite"></div>
        <div id="boot-splash">
          <div class="boot-logo">FALSE PROPHET</div>
          <div class="boot-sub">TUNING UP&hellip;</div>
        </div>
      </div>
      <aside id="side-right" class="side">
        <div class="side-controls">
          <h2>DESKTOP CONTROLS</h2>
          <dl>
            <dt>WASD / ARROWS</dt><dd>MOVE</dd>
            <dt>SPACE</dt><dd>SOLO</dd>
            <dt>SHIFT</dt><dd>BREAKDOWN</dd>
            <dt>ESC / P</dt><dd>PAUSE</dd>
            <dt>M</dt><dd>MUTE</dd>
          </dl>
          <p>Built for a phone held upright. One thumb moves; attacks fire themselves.</p>
        </div>
      </aside>
    </div>
    <div id="safe-probe" aria-hidden="true"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
